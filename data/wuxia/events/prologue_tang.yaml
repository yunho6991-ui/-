  weight: 0
  prologue: org_tang
  text: "독 둘을 섞다가 연기가 피어오른다. 옆방 제자가 쓰러진다."
  choices:
    - {text: 해독한다, check: {stat: 독술, dc: 50}, success: {aff: {npc_tangmuying: +2}, text: "당무영: \"…쓸 만하군.\""}, fail: {rep: {fac_tang: -1}, cost_actions: 2, text: "제자는 열흘을 앓는다. 벌로 약초밭 김매기."}}
