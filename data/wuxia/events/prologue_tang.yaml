# 사천당가의 제자 서막 (wuxia-prologues-full-2.md H) — 성도. 나는 13세: 인연은 열리기만(romance_open), 진행은 성인이 된 뒤
- id: ev_p_tang_1_1
  name: 아침의 독
  weight: 0
  prologue: org_tang
  death_possible: true
  text: "하얀 사발에 맑은 물 한 모금. 사형 당무영이 말한다. \"삼켜라. 오늘은 사흘거미 독이다. 죽지는 않는다. …아마.\""
  choices:
    - {text: 삼킨다, check: {stat: 체력, dc: 45, bonus_if: {"constitution:tr_poison_resist": 30}}, success: {skill_xp: {독술: 1}, text: "혀가 저리다. 그뿐이다. 당무영이 고개를 끄덕인다."}, fail: {cost_actions: 3, aff: {npc_tangsoso: +2}, roll: [{p: 0.3, result: {constitution: tr_poison_body}}, {p: 0.7, result: {}}], romance_open: npc_tangsoso, text: "사흘을 앓는다. 둘째 날 밤, 누군가 베갯머리에 해독약을 두고 간다. 웃음소리."}}
    - {text: 몰래 뱉는다, result: {text: "당무영이 다 안다. \"다시.\""}}
  record: "아침마다 독을 삼켰다"
- id: ev_p_tang_1_2
  name: 약초밭
  weight: 0
  prologue: org_tang
  text: "당가 약초밭엔 한 걸음마다 다른 독이 자란다. \"만지지 말고, 냄새로 외워라.\""
  choices:
    - {text: 냄새로 외운다, result: {skill_xp: {독술: 1}}}
    - {text: 이름 모를 풀을 살핀다, require: ["trait:맑은 눈"], show_reason: 맑은 눈, result: {item: [it_rare_poison_herb], text: "아무도 이름을 모르는 풀. 잎맥이 붉다."}}
- id: ev_p_tang_1_3
  name: 당소소의 장난
  weight: 0
  prologue: org_tang
  text: "당소소가 찻잔을 내민다. \"마셔 봐. 맛있어.\" 찻물 위에 기름막이 아주 얇게 떠 있다."
  choices:
    - {text: 알아챈다, check: {stat: 독술, dc: 40}, success: {aff: {npc_tangsoso: +4}, text: "\"어? 알아봤네?\""}, fail: {aff: {npc_tangsoso: +1}, text: "모르고 마셨다. 하루 종일 웃음이 멈추지 않는다."}}
    - {text: 마신다, result: {aff: {npc_tangsoso: +1}, text: "하루 종일 웃음이 멈추지 않는다. 당소소가 배를 잡고 깔깔 웃는다."}}
- id: ev_p_tang_2_1
  name: 만천화우
  weight: 0
  prologue: org_tang
  text: "사형이 손을 한 번 털자 나뭇잎 스무 장에 바늘이 동시에 박힌다. \"네 차례.\""
  choices:
    - {text: 수련한다, result: {learn: [ma_mantian], pts: {ma_mantian: 1}, bonus_if: {"talent_branch:암기": {pts: {ma_mantian: 1}}}}}
