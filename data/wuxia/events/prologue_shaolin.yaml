# 소림 동자승 서막 (wuxia-prologues-full-1.md F) — 숭산. 봉인탑 = 회귀 비밀 조각 4 · 5(wuxia-regression.md)
- id: ev_p_shaolin_1_1
  name: 물 긷기
  weight: 0
  prologue: org_shaolin
  text: "새벽 네 시. 물통 두 개를 지고 산 아래 개울까지 천 계단. 사형 정각이 앞서 걷는다. \"흘리지 마라. 흘린 물만큼 다시 간다.\""
  choices:
    - {text: 묵묵히 긷는다, result: {pts: {ma_shaolin_tuna: 1}, aff: {npc_jeonggak: +1}}}
