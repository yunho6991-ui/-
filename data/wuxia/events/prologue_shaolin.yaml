- id: ev_p_shaolin_1_2
  name: 장경각
  weight: 0
  prologue: org_shaolin
  text: "밤, 장경각 창문 틈으로 촛불이 새어 나온다. 수천 권의 책. 동자승은 들어갈 수 없다."
  choices:
    - {text: 몰래 들어간다, check: {stat: 은신, dc: 50}, success: {learn: {random_branch_up_to: 이류}, text: "손에 잡힌 책 한 권. 구결이 머리에 박힌다."}, fail: {cost_actions: 3, text: "들켰다. 물 긷기 열흘."}}
    - {text: 창밖에서 읽는다, result: {insight: 1, text: "촛불 그림자 너머로 글자 몇 줄."}}
- id: ev_p_shaolin_1_3
