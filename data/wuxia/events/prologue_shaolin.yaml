  weight: 0
  prologue: org_shaolin
  text: "정각 사형이 나한권 기본자세를 잡아 준다. \"주먹은 화가 아니라 숨으로 지르는 거다.\""
  choices:
    - {text: 대련한다, result: {pts: {ma_luohan_fist: 1}, aff: {npc_jeonggak: +2}}}
- id: ev_p_shaolin_2_1
  name: 밤의 목소리
  weight: 0
  prologue: org_shaolin
  text: "절 뒤편, 아무도 가지 않는 낡은 탑. 가면 혼이 빠진다는 소문. 오늘 밤, 탑에서 누군가 네 이름을 부른다. 아니 — 네가 모르는 이름을."
  choices:
    - {text: 가 본다, result: {next: ev_p_shaolin_2_2}}
    - {text: 사형에게 말한다, result: {aff: {npc_jeonggak: +3}, flag: jeonggak_hears, text: "정각의 얼굴이 하얘진다. \"…너도 들었구나.\""}}
    - {text: 이불을 뒤집어쓴다, result: {flag: pagoda_dreams, text: "그날부터 매일 밤, 같은 꿈."}}
  record: "봉인탑에서 모르는 이름을 들었다"
