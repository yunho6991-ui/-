  name: 첫날 밤
  weight: 0
  prologue: org_blood_children
  minor: true
  text: "횃불이 켜진다. 붉은 가면의 교관이 아이들 사이를 걷는다. \"너희는 오늘 죽었다. 여기서 다시 태어난다. 살아남는 자만 이름을 얻는다.\""
  choices:
    - {text: 고개를 숙인다, result: {text: "발소리가 지나간다."}}
