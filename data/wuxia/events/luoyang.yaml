  place: pl_luoyang
  weight: 4
  require: ["act:0-3"]
  main: true
  text: "길이 열리고 맹주의 가마가 지나간다. 휘장이 바람에 들린 순간, 노인이 소매로 입을 막는다. 소매 끝에 붉은 점."
  choices:
    - {text: 지켜본다, require: ["skill:의술>=서툶"], show_reason: 의술, result: {clue: leader_illness, text: "피를 토하는 병이다. 오래 못 간다."}}
    - {text: 지켜본다, require: ["!skill:의술>=서툶"], result: {text: "\"맹주께서 고단하신가 보다.\""}}

