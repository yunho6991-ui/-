- id: ev_c05
  name: 비무대
  place: pl_luoyang
  weight: 15
  text: "광장 한가운데 비무대. 누구나 오를 수 있다. 구경꾼들이 돈을 건다."
  choices:
    - {text: 오른다, require: ["realm>=이류"], result: {fight: {foe: npc_arena_fighter, count: 1, win: {fame: +4, money: +15}}}}
