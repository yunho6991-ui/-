# 의원 집 아이 서막 (wuxia-prologues-full-1.md E) — 청하진판. 이 출신이면 허연은 누이(가족 — 인연 대상 아님)
- id: ev_p_doctor_1_1
  name: 첫 환자
  weight: 0
  prologue: org_doctor
  text: "장꾼 하나가 피 흐르는 팔을 붙잡고 들어온다. 아버지는 왕진 나갔다. 누이가 너를 본다. \"네가 해 봐. 내가 옆에 있을게.\""
  choices:
    - {text: 꿰맨다, check: {stat: 의술, dc: 35}, success: {skill_xp: {의술: 2}, text: "장꾼이 감자 한 자루를 놓고 간다."}, fail: {skill_xp: {의술: 1}, text: "누이가 대신 실을 잡는다. \"괜찮아. 나도 처음엔 울었어.\""}}
  record: "처음으로 사람의 상처를 꿰맸다"
- id: ev_p_doctor_1_2
  name: 역병 마을
  weight: 0
  prologue: org_doctor
  death_possible: true
  text: "강 건너 마을에 열병이 돈다. 아버지가 보따리를 싼다. \"가겠느냐?\""
  choices:
    - {text: 따라간다, cost_actions: 2, result: {skill_xp: {의술: 3}, aff: {마을: +2, npc_heodam: +2}, sick: 0.15}}
    - {text: 남는다, result: {text: "빈 약방을 지킨다. 밤이 길다."}}
- id: ev_p_doctor_1_3
  name: 아버지의 상자
  weight: 0
  prologue: org_doctor
  text: "아버지 방 깊숙이 잠긴 상자. 틈으로 보이는 도포 자락에 태극 문양."
  choices:
    - {text: 연다, result: {item: [it_wudang_letter], text: "무당산 도사의 편지. \"…청허 사형께.\""}}
    - {text: 그대로 둔다, result: {}}
- id: ev_p_doctor_2_1
  name: 문을 두드리는 소리
  weight: 0
  prologue: org_doctor
  pick_npc: [npc_demon_wanderer, npc_blood_runaway, npc_namgung_branch]
  text: "비 오는 밤. 문 두드리는 소리가 약하다. 열자, 피투성이 사람이 쓰러진다."
  choices:
    - {text: 숨긴다, result: {next: ev_p_doctor_2_2}}
    - {text: 관아에 알린다, result: {next: ev_p_doctor_2_3}}
    - {text: 치료만 하고 내보낸다, result: {aff: {"{npc}": +1}, money: +10, text: "새벽, 그가 사라진 자리에 은자 몇 닢."}}
- id: ev_p_doctor_2_2
  name: 부상자의 이야기
  weight: 0
  prologue: org_doctor
  text: "열이 내리자 그가 입을 연다."
  choices:
    - {text: 들어 준다, result: {aff: {"{npc}": +3}, faction_secret: "{npc}", tag: [+숨겨준자]}}
- id: ev_p_doctor_2_3
  name: 관아
  weight: 0
  prologue: org_doctor
  text: "포쾌 장록이 와서 부상자를 끌어간다. 부상자가 너를 돌아본다. 아무 말도 없이."
  choices:
    - {text: 눈을 피한다, result: {aff: {"{npc}": -3, npc_janglok: +2}, remember_across_lives: "{npc}"}}
- id: ev_p_doctor_3_1
  name: 마을에 온 사람들
  weight: 0
  prologue: org_doctor
  death_possible: true
  text: "새벽, 낯선 무인들이 마을을 뒤진다. 약방 문을 연다. \"피 흘리는 놈 못 봤나?\""
  choices:
    - {text: 거짓말한다, require: ["tag:숨겨준자"], check: {stat: 연기, dc: 45, alt_stat: 말재주}, success: {ending: end_doctor_savior}, fail: {injury: 중상, death_check: 0.1, ending: end_doctor_village}}
    - {text: 넘긴다, require: ["tag:숨겨준자"], result: {aff: {"{npc}": -5}, ending: end_doctor_village}}
    - {text: 같이 뒷문으로 도망친다, require: ["tag:숨겨준자"], result: {next: ev_p_doctor_3_2}}
    - {text: 아무도 못 봤다, require: ["!tag:숨겨준자"], result: {ending: end_doctor_village}}
- id: ev_p_doctor_3_2
  name: 누이의 선택
  weight: 0
  prologue: org_doctor
  text: "누이가 약 보따리를 내민다. \"가. 아버지는 내가 맡을게. …꼭 살아서 와.\""
  choices:
    - {text: 떠난다, result: {item: [it_geumchang, it_antidote], ending: end_doctor_flee}}
