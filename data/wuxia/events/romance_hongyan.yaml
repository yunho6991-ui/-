# 홍염 인연 — 구원 루트 (wuxia-heroes.md 2). 적으로 만남 → 가면 아래 얼굴을 본 단 한 사람 → 복수를 내려놓을지. 나도 성인이어야(혈교 아이 출신은 강호에서 다시 만난 뒤)
