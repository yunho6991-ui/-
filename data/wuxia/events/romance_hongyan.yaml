- {id: ev_r_hongyan_2, name: 가면 아래, place: [pl_heishui, pl_luoyang, pl_hefei], weight: 10, require: ["aff:npc_hongyan>=신뢰", "!seen:ev_r_hongyan_2"], death_possible: true, text: "비 오는 밤, 폐사당. 그가 피를 흘리며 앉아 있다. 가면은 벗겨져 바닥에. 검은 눈과 붉은 눈이 너를 본다. \"…또 너냐.\"", choices: [{text: 상처를 싸맨다, cost_actions: 2, result: {aff: {npc_hongyan: +4}, clue: hongyan, text: "\"아버지는 이 눈을 보고 나를 버렸다. 너는 왜 안 도망가지.\""}}, {text: 가면을 주워 건넨다, result: {aff: {npc_hongyan: +2}}}, {text: 맹에 알린다, result: {aff: {npc_hongyan: -10}, rep: {fac_alliance: +3}, world: {ritual: -5}}}]}
- {id: ev_r_hongyan_3, name: 내려놓을 수 있다면, place: [pl_hefei, pl_luoyang], weight: 12, require: ["aff:npc_hongyan>=심복", "!seen:ev_r_hongyan_3"], text: "합비 남궁세가 담장 밖. 그가 오래 담장을 본다. \"복수만 보고 서른 해를 살았다. …그걸 내려놓으면 나는 뭐가 남지.\"", choices: [{text: "\"내가 남지.\"", result: {romance: {npc_hongyan: 연모}, world: {ritual: -10}, flag: hongyan_wavering, text: "그가 웃는다. 처음 보는, 서툰 웃음."}}, {text: "\"복수해. 같이 가 줄게.\"", result: {romance: {npc_hongyan: 연모}, rep: {fac_namgung: -10}, tag: [+남궁의적], text: "붉은 눈이 오래 너를 본다. \"…바보 같은 놈.\""}}]}
